# the formatters come from the flake, run `treefmt` in `nix develop` or `nix fmt`
tree-root-file = "flake.nix"
# zig's cache, what cubemx generates and the course's graphics library aren't
# ours. in a cubemx folder only files you add to Core get formatted
excludes = [
  ".direnv", "build/*", "*/build/*", "*/.zig-cache/*", "*/zig-out/*",
  "*/Drivers/*", "*/Middlewares/*", "*/cmake/*", "*/.settings/*",
  "*/CMakePresets.json", "*/README.md", "*/INSTALL.md",
  "*/Core/Inc/main.h", "*/Core/Inc/stm32h5xx_*",
  "*/Core/Src/main.c", "*/Core/Src/stm32h5xx_*", "*/Core/Src/system_*",
  "*/Core/Src/syscalls.c", "*/Core/Src/sysmem.c",
  "*/Core/*/graphics/*", "*/Core/*/dwt_module.*", "*/Core/Src/test.c",
]

[formatter.nix]
command = "nixfmt"
includes = ["*.nix"]

[formatter.prettier]
command = "prettier"
options = ["--write"]
includes = ["*.md", "*.json", "*.yaml"]

[formatter.c]
command = "clang-format"
options = ["-i"]
includes = ["*.c", "*.h"]

[formatter.zig]
command = "zig"
options = ["fmt"]
includes = ["*.zig"]

[formatter.python]
command = "ruff"
options = ["format"]
includes = ["*.py"]
